<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="white"/>
  
  <!-- Blue accent bar top -->
  <rect width="1200" height="6" fill="#3b82f6"/>
  
  <!-- Logo badge bottom left -->
  <rect x="60" y="500" width="72" height="72" rx="16" fill="#3b82f6"/>
  <text x="96" y="548" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">D24</text>
  
  <!-- Main headline -->
  <text x="600" y="200" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#050505" text-anchor="middle" letter-spacing="-2">YOUR WEBSITE</text>
  
  <!-- Divider line -->
  <line x1="200" y1="260" x2="1000" y2="260" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Sub headline -->
  <text x="600" y="360" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="#3b82f6" text-anchor="middle" letter-spacing="-3">24 HOURS</text>
  
  <!-- Price -->
  <text x="600" y="440" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#050505" text-anchor="middle" letter-spacing="-2">$350</text>
  
  <!-- Guarantee badge -->
  <rect x="420" y="500" width="360" height="50" rx="25" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="1">MONEY-BACK GUARANTEE</text>
</svg>
